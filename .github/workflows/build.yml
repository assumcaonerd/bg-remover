name: Build Executables

on:
  # Manual (botão "Run workflow" na aba Actions)
  workflow_dispatch:
  # Ao criar uma tag de versão (ex: v1.0.0)
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BG-Remover-Windows
            exe_path: dist/BG-Remover
          - os: ubuntu-latest
            artifact_name: BG-Remover-Linux
            exe_path: dist/BG-Remover

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller bg-remover.spec --noconfirm --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.exe_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        id: prep
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          mkdir -p release-assets
          cd artifacts

          for dir in */; do
            name=$(basename "$dir")
            zip_name="${name}-${TAG}.zip"
            echo "Creating $zip_name ..."
            (cd "$name" && zip -r "../../release-assets/$zip_name" .)
          done

          ls -lh ../release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: BG Remover ${{ steps.prep.outputs.tag }}
          body: |
            ## BG Remover ${{ steps.prep.outputs.tag }}

            Executáveis prontos para download.

            ### Arquivos
            - **BG-Remover-Windows-*.zip** → Windows 10/11 (64-bit)
            - **BG-Remover-Linux-*.zip** → Linux (x86_64)

            ### Como usar
            1. Baixe o zip da sua plataforma
            2. Extraia a pasta
            3. Execute `BG-Remover` (ou `BG-Remover.exe` no Windows)

            > Na primeira execução o modelo de IA será baixado automaticamente (pode levar 1–2 minutos).

            ### Changelog
            Veja os commits desde a versão anterior na aba de commits do repositório.
          files: release-assets/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
